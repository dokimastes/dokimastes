[package]
name = "dok"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Dokimastes — the gate. Release 0 is not yet cut; this binary only tests what refuses."
repository = "https://github.com/dokimastes/dokimastes"
publish = false

[[bin]]
name = "dok"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Acceptance scenarios in Gherkin; the runner is cucumber, not libtest.
[[test]]
name = "bdd"
harness = false

[profile.release]
codegen-units = 1
lto = true
strip = true
